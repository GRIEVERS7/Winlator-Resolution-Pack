name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Pull LFS and submodules
        run: |
          git lfs install
          git lfs pull
          git submodule update --init --recursive
          git -C app lfs pull || true

      - name: Patch duplicate native libs packaging
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")

          if "packagingOptions" not in text:
              text = re.sub(
                  r"(android\s*\{\s*)",
                  """\\1
              packagingOptions {
                  pickFirst 'lib/arm64-v8a/*.so'
                  pickFirst 'lib/armeabi-v7a/*.so'
                  pickFirst 'lib/x86/*.so'
                  pickFirst 'lib/x86_64/*.so'
              }

          """,
                  text,
                  count=1
              )

          gradle.write_text(text, encoding="utf-8")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake and NDK
        run: |
          sdkmanager "cmake;3.22.1" "ndk;24.0.8215888"

      - name: Make gradlew executable
        run: chmod +x app/gradlew

      - name: Build debug APK
        run: |
          cd app
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/app/build/outputs/apk/debug/*.apk release/Winlator-Resolution-Pack-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-RP-Base
          path: release/Winlator-Resolution-Pack-v1.0.apk